function updateSiderealTime(){

}

function updatePacificTime() {

    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    timeZoneName: 'short'
  };
  const pacificTime = new Intl.DateTimeFormat('en-US', options).format(new Date());

}

function updateUTCTime() {

    second: '2-digit',
    timeZone: 'UTC',

  });

function sortTable(){
  // Sort the data array
  if (numeric_fields.includes(sortKey)){

      table_data.sort((a, b) => a[sortKey] - b[sortKey]);

    console.log('sorting by field ' + sortKey + ' in ' + (isAscending ? 'ascending' : 'descending') + ' string order');
    table_data.sort((a, b) => {

function lstToLocalTime(lstHours, date, longitudeDeg, timezoneOffsetMinutes = 0) {
    const LST_deg = lstHours * 15; // Convert LST to degrees

    // 1. Compute Julian Date
    function getJulianDate(d) {
        return d.getTime() / 86400000 + 2440587.5;
    }

    const JD = getJulianDate(date);
    const D = JD - 2451545.0; // Days since J2000.0

    // 2. Greenwich Mean Sidereal Time (GMST) in degrees
    let GMST = 280.46061837 + 360.98564736629 * D;
    GMST = ((GMST % 360) + 360) % 360;

    // 3. Calculate the desired Greenwich Mean Sidereal Time from LST and longitude
    let desiredGMST = ((LST_deg - longitudeDeg) % 360 + 360) % 360;

    // 4. Compute sidereal time difference
    let deltaDeg = ((desiredGMST - GMST + 360) % 360);
    const siderealSecondsPerSolarSecond = 0.9972695663;

    // 5. Convert difference in sidereal degrees to solar seconds
    const deltaSiderealHours = deltaDeg / 15;
    const deltaSolarSeconds = (deltaSiderealHours * 3600) / siderealSecondsPerSolarSecond;

    // 6. Adjust the input date by that delta (forward or backward)
    const adjustedTime = new Date(date.getTime() + deltaSolarSeconds * 1000);

    // 7. Apply time zone offset if provided (in minutes)
    if (timezoneOffsetMinutes !== 0) {
        adjustedTime.setMinutes(adjustedTime.getMinutes() + timezoneOffsetMinutes);
    }

    return adjustedTime;
}


function raDecToAzEl(raHours, decDeg, date, latitudeDeg, longitudeDeg) {
    const toRadians = deg => deg * Math.PI / 180;
    const toDegrees = rad => rad * 180 / Math.PI;

    // 1. Convert RA to degrees
    const raDeg = raHours * 15;

    // 2. Julian Date
    function getJulianDate(date) {
        const time = date.getTime(); // ms since 1970-01-01
        return time / 86400000 + 2440587.5;
    }

    const JD = getJulianDate(date);
    const D = JD - 2451545.0; // Days since J2000.0

    // 3. Greenwich Sidereal Time (in degrees)
    let GST = 280.46061837 + 360.98564736629 * D;
    GST = ((GST % 360) + 360) % 360; // Normalize between 0–360

    // 4. Local Sidereal Time (LST)
    const LST = ((GST + longitudeDeg) % 360 + 360) % 360;

    // 5. Hour Angle (HA) in degrees
    let HA = ((LST - raDeg) + 360) % 360;
    if (HA > 180) HA -= 360; // Convert to [-180, 180]

    // Convert angles to radians
    const HA_rad = toRadians(HA);
    const dec_rad = toRadians(decDeg);
    const lat_rad = toRadians(latitudeDeg);

    // 6. Elevation (Altitude)
    const sinEl = Math.sin(dec_rad) * Math.sin(lat_rad) + 
                  Math.cos(dec_rad) * Math.cos(lat_rad) * Math.cos(HA_rad);
    const el = Math.asin(sinEl);

    // 7. Azimuth
    const cosAz = (Math.sin(dec_rad) - Math.sin(el) * Math.sin(lat_rad)) / 
                  (Math.cos(el) * Math.cos(lat_rad));
    let az = Math.acos(cosAz);

    // Adjust Azimuth depending on HA
    if (Math.sin(HA_rad) > 0) {
        az = 2 * Math.PI - az;
    }

    return {
        azimuth: toDegrees(az),      // in degrees [0, 360)
        elevation: toDegrees(el)     // in degrees [-90, 90]
    };
}

function getZenithRAandDec(date, latitudeDeg, longitudeDeg) {
    const toRadians = deg => deg * Math.PI / 180;
    const toDegrees = rad => rad * 180 / Math.PI;

    // 1. Julian Date
    function getJulianDate(date) {
        const time = date.getTime(); // ms since 1970-01-01
        return time / 86400000 + 2440587.5;
    }

    const JD = getJulianDate(date);
    const D = JD - 2451545.0; // Days since J2000.0

    // 2. Greenwich Sidereal Time (in degrees)
    let GST = 280.46061837 + 360.98564736629 * D;
    GST = ((GST % 360) + 360) % 360;

    // 3. Local Sidereal Time (LST) in degrees
    const LST_deg = ((GST + longitudeDeg) % 360 + 360) % 360;

    // 4. Convert LST to RA in hours
    const RA_hours = LST_deg / 15;

    // 5. Declination is the same as latitude
    const Dec_deg = latitudeDeg;

    return {
        rightAscension: RA_hours,  // in hours [0, 24)
        declination: Dec_deg       // in degrees [-90, 90]
    };
}

function getLocalSiderealTime() {
    date = new Date(); // current UTC time

    // Helper conversions
    const toRadians = deg => deg * Math.PI / 180;
    const toDegrees = rad => rad * 180 / Math.PI;

    // 1. Julian Date
    function getJulianDate(d) {
        return d.getTime() / 86400000 + 2440587.5;
    }

    const JD = getJulianDate(date);
    const D = JD - 2451545.0; // Days since J2000.0

    // 2. Calculate Greenwich Mean Sidereal Time (GMST) in degrees
    let GMST = 280.46061837 + 360.98564736629 * D;
    GMST = ((GMST % 360) + 360) % 360; // Normalize to [0, 360)

    // 3. Add observer's longitude to get LST
    let LST = (GMST + lon) % 360;
    if (LST < 0) LST += 360;

    const LST_hours = LST / 15; // Convert degrees to hours
    return LST_hours; // In sidereal hours [0, 24)
}
