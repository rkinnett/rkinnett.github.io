const gradientShadingPlugin = {
  id: 'gradientShading',
  beforeDatasetsDraw(chart, args, regions) {
    const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;

    (regions || []).forEach(region => {
      const xStart = x.getPixelForValue(region.xMin);
      const xEnd = x.getPixelForValue(region.xMax);

      // Create horizontal gradient between xMin and xMax
      const gradient = ctx.createLinearGradient(xStart, 0, xEnd, 0);
      gradient.addColorStop(0, region.colorStart || 'rgba(255,255,0,0.3)');
      gradient.addColorStop(1, region.colorEnd || 'rgba(255,0,0,0.3)');

      ctx.save();
      ctx.fillStyle = gradient;
      ctx.fillRect(xStart, top, xEnd - xStart, bottom - top);
      ctx.restore();
    });
  }
};
Chart.register(gradientShadingPlugin);


const shadedRegionPlugin = {
  id: 'shadedRegion',
  beforeDatasetsDraw(chart, args, pluginOptionsArray) {
    const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
    const xMinValue = x.min;
    const xMaxValue = x.max;  

    (pluginOptionsArray || []).forEach(opts => {
      const clippedStart = Math.max(opts.xMin.getTime(), xMinValue.getTime ? xMinValue.getTime() : xMinValue);
      const clippedEnd   = Math.min(opts.xMax.getTime(), xMaxValue.getTime ? xMaxValue.getTime() : xMaxValue);

      if (clippedStart >= clippedEnd) return; // skip if no visible overlap

      const xStartPx = x.getPixelForValue(clippedStart);
      const xEndPx = x.getPixelForValue(clippedEnd);    
    
      ctx.save();
      ctx.fillStyle = opts.color || 'rgba(200, 200, 200, 0.3)';
      ctx.fillRect(xStartPx, top, xEndPx - xStartPx, bottom - top);
      ctx.restore();
    });
  }
};
Chart.register(shadedRegionPlugin);

function getTimeZoneAbbreviation(date = new Date()) {
  const options = { timeZoneName: 'short' };
  const formatter = new Intl.DateTimeFormat('en-US', options);
  const parts = formatter.formatToParts(date);
  const tz = parts.find(part => part.type === 'timeZoneName');
  return tz ? tz.value : 'Unknown';
}


function updateSiderealTime(){

  LST_whole_seconds = Math.floor( (((LST_hours % 1) * 60) % 1 ) *60 );
  lst_text_area.innerHTML = LST_whole_hours + " hr " + LST_whole_minutes + " m " + LST_whole_seconds + " s";
}

function updatePacificTime() {
  const options = {
    timeZone: 'America/Los_Angeles',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    timeZoneName: 'short',
    hour12: false
  };
  const pacificTime = new Intl.DateTimeFormat('en-US', options).format(new Date());
  local_time_text_area.textContent = pacificTime;
}

function updateUTCTime() {
  const utcFormatter = new Intl.DateTimeFormat('en-US', {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    timeZone: 'UTC', 
    timeZoneName: 'short',
    hour12: false
  });
  utc_time_text_area.textContent = utcFormatter.format(date);
}

      throw new Error(`HTTP error! status: ${response.status}`);

}

function lstToLocalTime(lstHours) {
    const LST_deg = lstHours * 15; // Convert LST to degrees

    const timezoneOffsetMinutes = -date.getTimezoneOffset(); // convert to hours and flip sign

    // 1. Compute Julian Date
    function getJulianDate(d) {
        return d.getTime() / 86400000 + 2440587.5;
    }

    const JD = getJulianDate(date);
    const D = JD - 2451545.0; // Days since J2000.0

    // 2. Greenwich Mean Sidereal Time (GMST) in degrees
    let GMST = 280.46061837 + 360.98564736629 * D;
    GMST = ((GMST % 360) + 360) % 360;

    // 3. Calculate the desired Greenwich Mean Sidereal Time from LST and longitude
    let desiredGMST = ((LST_deg - lon) % 360 + 360) % 360;

    // 4. Compute sidereal time difference
    let deltaDeg = ((desiredGMST - GMST + 360) % 360);
    const siderealSecondsPerSolarSecond = 0.9972695663;

    // 5. Convert difference in sidereal degrees to solar seconds
    const deltaSiderealHours = deltaDeg / 15;
    const deltaSolarSeconds = (deltaSiderealHours * 3600) / siderealSecondsPerSolarSecond;

    // 6. Adjust the input date by that delta (forward or backward)
    const adjustedTime = new Date(date.getTime() + deltaSolarSeconds * 1000);

    // 7. Apply time zone offset if provided (in minutes)
    if (timezoneOffsetMinutes !== 0) {
        adjustedTime.setMinutes(adjustedTime.getMinutes() + timezoneOffsetMinutes);
    }

    return adjustedTime;
}


function raDecToAzEl(raHours, decDeg, date, latitudeDeg, longitudeDeg) {
    const toRadians = deg => deg * Math.PI / 180;
    const toDegrees = rad => rad * 180 / Math.PI;

    // 1. Convert RA to degrees
    const raDeg = raHours * 15;

    // 2. Julian Date
    function getJulianDate(date) {
        const time = date.getTime(); // ms since 1970-01-01
        return time / 86400000 + 2440587.5;
    }

    const JD = getJulianDate(date);
    const D = JD - 2451545.0; // Days since J2000.0

    // 3. Greenwich Sidereal Time (in degrees)
    let GST = 280.46061837 + 360.98564736629 * D;
    GST = ((GST % 360) + 360) % 360; // Normalize between 0–360

    // 4. Local Sidereal Time (LST)
    const LST = ((GST + longitudeDeg) % 360 + 360) % 360;

    // 5. Hour Angle (HA) in degrees
    let HA = ((LST - raDeg) + 360) % 360;
    if (HA > 180) HA -= 360; // Convert to [-180, 180]

    // Convert angles to radians
    const HA_rad = toRadians(HA);
    const dec_rad = toRadians(decDeg);
    const lat_rad = toRadians(latitudeDeg);

    // 6. Elevation (Altitude)
    const sinEl = Math.sin(dec_rad) * Math.sin(lat_rad) + 
                  Math.cos(dec_rad) * Math.cos(lat_rad) * Math.cos(HA_rad);
    const el = Math.asin(sinEl);

    // 7. Azimuth
    const cosAz = (Math.sin(dec_rad) - Math.sin(el) * Math.sin(lat_rad)) / 
                  (Math.cos(el) * Math.cos(lat_rad));
    let az = Math.acos(cosAz);

    // Adjust Azimuth depending on HA
    if (Math.sin(HA_rad) > 0) {
        az = 2 * Math.PI - az;
    }

    return {
        azimuth: toDegrees(az),      // in degrees [0, 360)
        elevation: toDegrees(el)     // in degrees [-90, 90]
    };
}

function getZenithRAandDec(date, latitudeDeg, longitudeDeg) {
    const toRadians = deg => deg * Math.PI / 180;
    const toDegrees = rad => rad * 180 / Math.PI;

    // 1. Julian Date
    function getJulianDate(date) {
        const time = date.getTime(); // ms since 1970-01-01
        return time / 86400000 + 2440587.5;
    }

    const JD = getJulianDate(date);
    const D = JD - 2451545.0; // Days since J2000.0

    // 2. Greenwich Sidereal Time (in degrees)
    let GST = 280.46061837 + 360.98564736629 * D;
    GST = ((GST % 360) + 360) % 360;

    // 3. Local Sidereal Time (LST) in degrees
    const LST_deg = ((GST + longitudeDeg) % 360 + 360) % 360;

    // 4. Convert LST to RA in hours
    const RA_hours = LST_deg / 15;

    // 5. Declination is the same as latitude
    const Dec_deg = latitudeDeg;

    return {
        rightAscension: RA_hours,  // in hours [0, 24)
        declination: Dec_deg       // in degrees [-90, 90]
    };
}

function getLocalSiderealTime() {
    date = new Date(); // current UTC time

    // Helper conversions
    const toRadians = deg => deg * Math.PI / 180;
    const toDegrees = rad => rad * 180 / Math.PI;

    // 1. Julian Date
    function getJulianDate(d) {
        return d.getTime() / 86400000 + 2440587.5;
    }

    const JD = getJulianDate(date);
    const D = JD - 2451545.0; // Days since J2000.0

    // 2. Calculate Greenwich Mean Sidereal Time (GMST) in degrees
    let GMST = 280.46061837 + 360.98564736629 * D;
    GMST = ((GMST % 360) + 360) % 360; // Normalize to [0, 360)

    // 3. Add observer's longitude to get LST
    let LST = (GMST + lon) % 360;
    if (LST < 0) LST += 360;

    const LST_hours = LST / 15; // Convert degrees to hours
    return LST_hours; // In sidereal hours [0, 24)
}

function generateDateRange(startDate, endDate, incrementMinutes) {
  const result = [];
  const incremental_date = new Date(startDate);
  while (incremental_date <= endDate) {
    result.push(new Date(incremental_date)); // Push a copy
    incremental_date.setMinutes(incremental_date.getMinutes() + incrementMinutes);
  }
  return result;
}

function getSunsetTime(date, latitude, longitude) {

  // Helper: Day of year (1–366)
  function getDayOfYear(d) {
    const start = new Date(Date.UTC(d.getUTCFullYear(), 0, 0));
    return Math.floor((d - start) / (1000 * 60 * 60 * 24));
  }
  const dayOfYear = getDayOfYear(date);

  // Solar declination and equation of time (approximation)
  const B = 2 * Math.PI * (dayOfYear - 81) / 364;
  const EoT = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B); // in minutes
  const decl = 23.45 * rad * Math.sin(2 * Math.PI * (284 + dayOfYear) / 365);

  const latRad = latitude * rad;

  // Hour angle for sunset
  const ha = Math.acos(
    Math.cos(90.833 * rad) / (Math.cos(latRad) * Math.cos(decl)) -
    Math.tan(latRad) * Math.tan(decl)
  );

  // Solar noon in minutes from UTC midnight
  const solarNoonUTC = 720 - 4 * longitude - EoT;

  // Sunset time in minutes from UTC midnight
  const sunsetUTC = solarNoonUTC + (deg * ha * 4);

  // Convert to Date object
  const sunsetHour = Math.floor(sunsetUTC / 60);
  const sunsetMinute = Math.floor(sunsetUTC % 60);

  return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(), sunsetHour, sunsetMinute));
}


function getSunriseTime(date, latitude, longitude) {
  function getDayOfYear(d) {
    const start = new Date(Date.UTC(d.getUTCFullYear(), 0, 0));
    return Math.floor((d - start) / (1000 * 60 * 60 * 24));
  }
  const dayOfYear = getDayOfYear(date);

  // Equation of Time and Solar Declination (approximate formulas)
  const B = 2 * Math.PI * (dayOfYear - 81) / 364;
  const EoT = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B); // in minutes
  const decl = 23.45 * rad * Math.sin(2 * Math.PI * (284 + dayOfYear) / 365);

  const latRad = latitude * rad;

  // Hour angle for sunrise
  const ha = Math.acos(
    Math.cos(90.833 * rad) / (Math.cos(latRad) * Math.cos(decl)) -
    Math.tan(latRad) * Math.tan(decl)
  );

  // Solar noon in UTC minutes from midnight
  const solarNoonUTC = 720 - 4 * longitude - EoT;

  // Sunrise = solar noon - hour angle in time
  const sunriseUTC = solarNoonUTC - (deg * ha * 4); // in minutes

  const sunriseHour = Math.floor(sunriseUTC / 60);
  const sunriseMinute = Math.floor(sunriseUTC % 60);

  return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(), sunriseHour, sunriseMinute));
}
